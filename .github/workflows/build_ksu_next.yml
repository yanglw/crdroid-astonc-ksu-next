name: Build crDroid 16.0 Boot (KernelSU / KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Direct download URL for stock boot.img'
        required: true
      ksu_variant:
        description: 'Root Solution'
        required: true
        type: choice
        default: 'All'
        options:
          - 'All'
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'None (Pure Stock)'
      custom_commit:
        description: 'Kernel Commit SHA (Leave blank to auto-detect from boot.img)'
        required: false
        default: ''

jobs:
  setup:
    name: Prepare Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Resolve Target Variants
        id: set-matrix
        run: |
          CHOICE="${{ github.event.inputs.ksu_variant }}"
          if [ "$CHOICE" = "All" ]; then
            echo 'matrix=["KernelSU-Next", "KernelSU", "None (Pure Stock)"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${CHOICE}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.ksu_variant }})
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ksu_variant: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 释放磁盘空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

          # 配置 24GB Swap (支持 Full LTO)
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo 100 | sudo tee /proc/sys/vm/swappiness || true

          # 安装必要依赖
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            zip python3 binutils file dwarves pkg-config

          # 安装 magiskboot
          MAGISK_URL=$(curl -s ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} "https://api.github.com/repos/topjohnwu/Magisk/releases/latest" | grep "browser_download_url.*Magisk-.*\.apk" | head -n 1 | cut -d '"' -f 4 || true)
          [ -z "$MAGISK_URL" ] && MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          curl -LSs -f "$MAGISK_URL" -o /tmp/magisk.apk
          unzip -p /tmp/magisk.apk lib/x86_64/libmagiskboot.so > /tmp/magiskboot
          chmod +x /tmp/magiskboot
          sudo mv /tmp/magiskboot /usr/local/bin/magiskboot
          rm -f /tmp/magisk.apk

          # 安装 AOSP Clang r563880c (Clang 21)
          echo "Setting up AOSP Clang toolchain..."
          curl -LSs -f -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          mkdir -p "${GITHUB_WORKSPACE}/clang"
          unzip -q /tmp/ndk.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/*" -d /tmp
          mv /tmp/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/* "${GITHUB_WORKSPACE}/clang/"
          rm -rf /tmp/ndk.zip /tmp/android-ndk-r29
          "${GITHUB_WORKSPACE}/clang/bin/clang" --version

      - name: Fetch Stock boot.img & Extract Config
        run: |
          mkdir -p prebuilt repack configs
          RAW_INPUT="${{ github.event.inputs.boot_url }}"
          CLEAN_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^])" >]+' | head -n 1)
          [ -z "$CLEAN_URL" ] && CLEAN_URL="$RAW_INPUT"

          if [[ "$CLEAN_URL" == *"sourceforge.net/projects/"* ]]; then
            CLEAN_URL=$(echo "$CLEAN_URL" | sed -E -e 's|/download/?$||' -e 's|sourceforge\.net/projects/|downloads.sourceforge.net/project/|' -e 's|/files/|/|')
          fi

          echo "Downloading: $CLEAN_URL"
          curl -LSs -f -o prebuilt/boot.img "$CLEAN_URL" || \
          curl -LSs -f -o prebuilt/boot.img "${CLEAN_URL}?use_mirror=autoselect" || \
          curl -LSs -f -o prebuilt/boot.img "${RAW_INPUT}"

          file prebuilt/boot.img | grep -qiE "HTML|ASCII text" && { echo "Error: Invalid boot image binary"; exit 1; }

          cp prebuilt/boot.img repack/
          cd repack
          magiskboot unpack boot.img

          KERNEL_BANNER=$(strings kernel | grep -m 1 -E "Linux version 5\.15\.[0-9]+" || true)
          echo "Stock Banner: ${KERNEL_BANNER}"

          STOCK_UTS=$(echo "$KERNEL_BANNER" | sed -E -n 's/.*Linux version ([^ ]+).*/\1/p' | head -n 1)
          DETECTED_SHA=$(echo "$STOCK_UTS" | grep -oE -- '-g[0-9a-f]+' | head -n 1 | sed 's/-g//' || true)
          SCM_SUFFIX=$(echo "$STOCK_UTS" | sed -E 's/^5\.15\.[0-9]+//' || true)

          echo "STOCK_UTS=${STOCK_UTS}" >> $GITHUB_ENV
          echo "DETECTED_SHA=${DETECTED_SHA}" >> $GITHUB_ENV
          echo "SCM_SUFFIX=${SCM_SUFFIX}" >> $GITHUB_ENV

          # 提取嵌入的 IKCONFIG
          python3 -c "
          data = open('kernel', 'rb').read()
          magic = bytes([0x49, 0x4B, 0x43, 0x46, 0x47, 0x5F, 0x53, 0x54, 0x1F, 0x8B])
          pos = data.find(magic)
          if pos != -1:
              with open('raw_config.gz', 'wb') as f:
                  f.write(data[pos+8:])
          " || true

          if [ -f "raw_config.gz" ]; then
            zcat raw_config.gz > "${GITHUB_WORKSPACE}/configs/stock.config" 2>/dev/null || \
            gzip -dc raw_config.gz > "${GITHUB_WORKSPACE}/configs/stock.config" 2>/dev/null || true
          fi

          [ -s "${GITHUB_WORKSPACE}/configs/stock.config" ] || { echo "Error: Failed to extract kernel config"; exit 1; }
          echo "Successfully extracted $(wc -l < ${GITHUB_WORKSPACE}/configs/stock.config) lines of stock config."

      - name: Checkout Kernel Source & Hardware Modules
        run: |
          TARGET_COMMIT="${{ github.event.inputs.custom_commit }}"
          [ -z "$TARGET_COMMIT" ] && TARGET_COMMIT="$DETECTED_SHA"

          # 解析短 SHA 为完整 40 位 SHA (保证 git fetch --depth 1 成功)
          if [ -n "$TARGET_COMMIT" ] && [ ${#TARGET_COMMIT} -lt 40 ]; then
            FULL_SHA=$(curl -s -f "https://api.github.com/repos/crdroidandroid/android_kernel_oneplus_sm8550/commits/${TARGET_COMMIT}" | grep -m1 '"sha":' | cut -d '"' -f 4 || true)
            [ -n "$FULL_SHA" ] && [ ${#FULL_SHA} -eq 40 ] && TARGET_COMMIT="$FULL_SHA"
          fi

          mkdir -p kernel && cd kernel
          git init
          git config advice.detachedHead false
          git remote add origin https://github.com/crdroidandroid/android_kernel_oneplus_sm8550.git

          if [ -n "$TARGET_COMMIT" ]; then
            echo "Fetching target commit: $TARGET_COMMIT"
            git fetch --depth 1 origin "$TARGET_COMMIT" || git fetch --depth 1 origin 16.0
            git checkout FETCH_HEAD
          else
            echo "Fetching 16.0 HEAD..."
            git fetch --depth 1 origin 16.0
            git checkout FETCH_HEAD
          fi

          FINAL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(echo "${FINAL_SHA}" | cut -c1-12)
          SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          BUILD_DATE=$(date +'%Y%m%d')

          # 链接 18 个配套硬件驱动目录
          git clone --depth 1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8550-modules.git "${GITHUB_WORKSPACE}/sm8550-modules"
          MROOT="${GITHUB_WORKSPACE}/sm8550-modules"
          mkdir -p drivers/soc/oplus kernel/oplus_cpu
          ln -sfn "$MROOT/oplus/kernel/cpu/thermal"                                   kernel/oplus_cpu/thermal
          ln -sfn "$MROOT/oplus/kernel/touchpanel/kernelFwUpdate"                    drivers/base/kernelFwUpdate
          ln -sfn "$MROOT/oplus/kernel/touchpanel/oplus_touchscreen_v2"              drivers/input/touchscreen/oplus_touchscreen_v2
          ln -sfn "$MROOT/oplus/kernel/touchpanel/synaptics_hbp"                     drivers/input/touchscreen/synaptics_hbp
          ln -sfn "$MROOT/oplus/kernel/touchpanel/oplus_touchscreen_v2/touch_custom" drivers/input/touchscreen/touch_custom
          ln -sfn "$MROOT/oplus/secure/biometrics/fingerprints/bsp/uff/driver"       drivers/input/uff_fp_drivers
          ln -sfn "$MROOT/oplus/kernel/leds/aw210xx"                                 drivers/leds/aw210xx
          ln -sfn "$MROOT/oplus/kernel/vibrator/aw8697_haptic"                       drivers/misc/aw8697_haptic
          ln -sfn "$MROOT/oplus/kernel/device_info/tri_state_key"                    drivers/misc/tri_state_key
          ln -sfn "$MROOT/oplus/secure/common/bsp/drivers"                           drivers/misc/oplus_secure
          ln -sfn "$MROOT/oplus/kernel/nfc"                                          drivers/nfc/oplus_nfc
          ln -sfn "$MROOT/oplus/kernel/charger"                                      drivers/power/oplus
          ln -sfn "$MROOT/oplus/kernel/boot"                                         drivers/soc/oplus/boot
          ln -sfn "$MROOT/oplus/kernel/device_info/device_info"                      drivers/soc/oplus/device_info
          ln -sfn "$MROOT/oplus/kernel/dfr"                                          drivers/soc/oplus/dfr
          ln -sfn "$MROOT/oplus/kernel/dft"                                          drivers/soc/oplus/dft
          ln -sfn "$MROOT/oplus/sensor/kernel/oplus_consumer_ir"                     drivers/soc/oplus/oplus_consumer_ir
          ln -sfn "$MROOT/oplus/sensor/kernel/qcom/sensor"                           drivers/soc/oplus/sensor

          # 设置 vermagic 与导出命名变量
          [ -n "$SCM_SUFFIX" ] && echo -n "${SCM_SUFFIX}" > .scmversion || touch .scmversion

          VARIANT="${{ matrix.ksu_variant }}"
          case "${VARIANT}" in
            "KernelSU")
              KSU_TAG="ksu"
              KSU_LABEL="KernelSU (Official)"
              ;;
            "KernelSU-Next")
              KSU_TAG="ksu-next"
              KSU_LABEL="KernelSU-Next"
              ;;
            *)
              KSU_TAG="stock"
              KSU_LABEL="Pure Stock"
              ;;
          esac

          IMG_NAME="crdroid-16.0-astonc-5.15.${SUBLEVEL}-${SHORT_SHA}-${KSU_TAG}-${BUILD_DATE}.img"
          AK3_NAME="crdroid-16.0-astonc-5.15.${SUBLEVEL}-${SHORT_SHA}-${KSU_TAG}-${BUILD_DATE}-AK3.zip"

          echo "FINAL_SHA=${FINAL_SHA}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "SUBLEVEL=${SUBLEVEL}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "KSU_TAG=${KSU_TAG}" >> $GITHUB_ENV
          echo "KSU_LABEL=${KSU_LABEL}" >> $GITHUB_ENV
          echo "IMG_NAME=${IMG_NAME}" >> $GITHUB_ENV
          echo "AK3_NAME=${AK3_NAME}" >> $GITHUB_ENV

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          VARIANT="${{ matrix.ksu_variant }}"
          if [ "${VARIANT}" = "KernelSU" ]; then
            curl -LSs -f "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "${VARIANT}" = "KernelSU-Next" ]; then
            curl -LSs -f "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi

          mkdir -p out
          cp "${GITHUB_WORKSPACE}/configs/stock.config" out/.config
          [ -n "$SCM_SUFFIX" ] && echo -n "${SCM_SUFFIX}" > out/.scmversion || touch out/.scmversion

          if [ "${VARIANT}" != "None (Pure Stock)" ]; then
            ./scripts/config --file out/.config -e KSU -d KSU_SUSFS
          fi

          # 宿主机工具使用原生 gcc 编译以支持 libelf 与 BTF 生成
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld \
            HOSTCFLAGS="-I/usr/include" HOSTLDFLAGS="-L/usr/lib/x86_64-linux-gnu" \
            olddefconfig

          echo "Compiling kernel Image (Full LTO)..."
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld \
            HOSTCFLAGS="-I/usr/include" HOSTLDFLAGS="-L/usr/lib/x86_64-linux-gnu" \
            Image

      - name: Package Boot Image & AnyKernel3
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          IMAGE_PATH="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image"
          [ -f "$IMAGE_PATH" ] || { echo "Error: Kernel Image not found"; exit 1; }

          # 1. 打包 boot.img
          cd "${GITHUB_WORKSPACE}/repack"
          cp "$IMAGE_PATH" kernel
          magiskboot repack boot.img "${IMG_NAME}"
          mv "${IMG_NAME}" "${GITHUB_WORKSPACE}/dist/"

          # 2. 打包 AnyKernel3 卡刷包
          cd "${GITHUB_WORKSPACE}"
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          sed -i -e 's/kernel.string=.*/kernel.string=crDroid 16.0 Kernel for OnePlus Ace 3 \/ 12R/' \
                 -e 's/do.devicecheck=1/do.devicecheck=1/' \
                 -e 's/device.name1=.*/device.name1=astonc/' \
                 -e 's/device.name2=.*/device.name2=aston/' \
                 -e 's/device.name3=.*/device.name3=OnePlus12R/' \
                 -e 's/device.name4=.*/device.name4=OP594DL1/' \
                 -e 's/device.name5=.*/device.name5=/' \
                 AnyKernel3/anykernel.sh
          cp "$IMAGE_PATH" AnyKernel3/Image
          ( cd AnyKernel3 && zip -r9 "${GITHUB_WORKSPACE}/dist/${AK3_NAME}" . -x '.git*' 'README.md' )

          # 3. 保存元数据供发布步骤解析
          echo "SUBLEVEL=${SUBLEVEL}" > "${GITHUB_WORKSPACE}/dist/metadata.env"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_WORKSPACE}/dist/metadata.env"
          echo "FINAL_SHA=${FINAL_SHA}" >> "${GITHUB_WORKSPACE}/dist/metadata.env"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_WORKSPACE}/dist/metadata.env"

      - name: Upload Matrix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.KSU_TAG }}
          path: dist/*

  release:
    name: Publish Release
    needs: [setup, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release_dist
          merge-multiple: true

      - name: Publish Unified GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release_dist
          if [ -f "metadata.env" ]; then
            source metadata.env
            rm -f metadata.env
          fi

          # 生成合并后的校验哈希
          sha256sum *.img *.zip > sha256.txt
          echo "Output files ready for release:"
          ls -la

          CHOICE="${{ github.event.inputs.ksu_variant }}"
          if [ "$CHOICE" = "All" ]; then
            TAG_NAME="v16.0-5.15.${SUBLEVEL}-${SHORT_SHA}-all-${BUILD_DATE}"
            RELEASE_TITLE="crDroid 16.0 (5.15.${SUBLEVEL}-${SHORT_SHA}) All Variants"
          else
            TAG_NAME="v16.0-5.15.${SUBLEVEL}-${SHORT_SHA}-${CHOICE}-${BUILD_DATE}"
            RELEASE_TITLE="crDroid 16.0 (5.15.${SUBLEVEL}-${SHORT_SHA}) ${CHOICE}"
          fi

          cat <<EOF > release_notes.md
### 规格信息
- **适用设备**: 一加 Ace 3 / 一加 12R (`astonc` / `aston`)
- **系统版本**: crDroid 16.0 (Android 16)
- **内核版本**: Linux 5.15.${SUBLEVEL} ([`${SHORT_SHA}`](https://github.com/crdroidandroid/android_kernel_oneplus_sm8550/commit/${FINAL_SHA}))
- **构建方案**: ${CHOICE}
- **编译器**: AOSP Clang r563880c (Clang 21.0.0)

### 产物格式说明
- **`.img` (Boot 镜像)**: 官方底包重封装镜像，适用于电脑端 Fastboot 线刷。
- **`-AK3.zip` (AnyKernel3 卡刷包)**: 原地替换内核并保留系统 ramdisk 与引导参数，推荐在 Recovery 模式下卡刷。

### 版本后缀说明
- **`ksu-next`**: 集成 KernelSU-Next 分支（支持新特性与模块）
- **`ksu`**: 集成 KernelSU 官方稳定分支（成熟稳定）
- **`stock`**: 原生未 Root 纯净内核（用于一键救砖或无损卸载 Root）

### 刷入说明
- **Recovery 卡刷 (推荐)**: 手机进入 Recovery 模式 -> \`adb sideload <对应的 AK3.zip>\`
- **Fastboot 线刷**: \`fastboot flash boot <对应的 boot.img>\`
EOF

          gh release create "${TAG_NAME}" \
            * \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md || \
          gh release upload "${TAG_NAME}" * --clobber