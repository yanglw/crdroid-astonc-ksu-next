name: Build crDroid Boot (KernelSU / KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      boot_url_13:
        description: 'crDroid 13 (Android 17) stock boot.img URL (Leave blank to skip)'
        required: false
        default: ''
      boot_url_12:
        description: 'crDroid 12 (Android 16) stock boot.img URL (Leave blank to skip)'
        required: false
        default: ''
      ksu_variant:
        description: 'Root Solution'
        required: true
        type: choice
        default: 'All'
        options:
          - 'All'
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'None (Pure Stock)'
      custom_commit_13:
        description: 'Kernel Commit SHA for crDroid 13 (Leave blank to auto-detect)'
        required: false
        default: ''
      custom_commit_12:
        description: 'Kernel Commit SHA for crDroid 12 (Leave blank to auto-detect)'
        required: false
        default: ''

jobs:
  setup:
    name: Prepare Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      built_versions: ${{ steps.set-matrix.outputs.built_versions }}
    steps:
      - name: Resolve Matrix
        id: set-matrix
        env:
          URL_13: ${{ github.event.inputs.boot_url_13 }}
          URL_12: ${{ github.event.inputs.boot_url_12 }}
          COMMIT_13: ${{ github.event.inputs.custom_commit_13 }}
          COMMIT_12: ${{ github.event.inputs.custom_commit_12 }}
          KSU_CHOICE: ${{ github.event.inputs.ksu_variant }}
        run: |
          python3 -c '
          import json, os

          url13 = os.environ.get("URL_13", "").strip()
          url12 = os.environ.get("URL_12", "").strip()
          commit13 = os.environ.get("COMMIT_13", "").strip()
          commit12 = os.environ.get("COMMIT_12", "").strip()
          ksu_choice = os.environ.get("KSU_CHOICE", "All")

          if ksu_choice == "All":
              ksu_list = ["KernelSU-Next", "KernelSU", "None (Pure Stock)"]
          else:
              ksu_list = [ksu_choice]

          matrix = []
          built_versions = []

          # 填写了 13 的 boot.img URL 则构建 13
          if url13:
              built_versions.append("13")
              for ksu in ksu_list:
                  matrix.append({
                      "version": "13",
                      "cr_ver": "13.0",
                      "android_ver": "Android 17",
                      "cr_branch": "17.0",
                      "boot_url": url13,
                      "custom_commit": commit13,
                      "ksu_variant": ksu
                  })

          # 填写了 12 的 boot.img URL 则构建 12
          if url12:
              built_versions.append("12")
              for ksu in ksu_list:
                  matrix.append({
                      "version": "12",
                      "cr_ver": "12.0",
                      "android_ver": "Android 16",
                      "cr_branch": "16.0",
                      "boot_url": url12,
                      "custom_commit": commit12,
                      "ksu_variant": ksu
                  })

          if not matrix:
              print("ERROR: No boot.img URL provided! Please fill in boot_url_13 or boot_url_12 (or both).")
              exit(1)

          matrix_json = json.dumps(matrix)
          versions_str = ",".join(built_versions)

          print(f"Generated Matrix ({len(matrix)} parallel jobs): {matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix_json}\n")
              f.write(f"built_versions={versions_str}\n")
          '

  build:
    name: Build (${{ matrix.cr_ver }} - ${{ matrix.ksu_variant }})
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 释放磁盘空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

          # 配置 24GB Swap (支持 Full LTO)
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo 100 | sudo tee /proc/sys/vm/swappiness || true

          # 安装必要依赖
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            zip python3 binutils file dwarves pkg-config

          # 安装 magiskboot
          MAGISK_URL=$(curl -s ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} "https://api.github.com/repos/topjohnwu/Magisk/releases/latest" | grep "browser_download_url.*Magisk-.*\.apk" | head -n 1 | cut -d '"' -f 4 || true)
          [ -z "$MAGISK_URL" ] && MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          curl -LSs -f "$MAGISK_URL" -o /tmp/magisk.apk
          unzip -p /tmp/magisk.apk lib/x86_64/libmagiskboot.so > /tmp/magiskboot
          chmod +x /tmp/magiskboot
          sudo mv /tmp/magiskboot /usr/local/bin/magiskboot
          rm -f /tmp/magisk.apk

          # 安装 AOSP Clang r563880c (Clang 21)
          echo "Setting up AOSP Clang toolchain..."
          curl -LSs -f -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          mkdir -p "${GITHUB_WORKSPACE}/clang"
          unzip -q /tmp/ndk.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/*" -d /tmp
          mv /tmp/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/* "${GITHUB_WORKSPACE}/clang/"
          rm -rf /tmp/ndk.zip /tmp/android-ndk-r29
          "${GITHUB_WORKSPACE}/clang/bin/clang" --version

      - name: Fetch Stock boot.img & Extract Config
        run: |
          mkdir -p prebuilt repack configs
          RAW_INPUT="${{ matrix.boot_url }}"
          CLEAN_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^])" >]+' | head -n 1)
          [ -z "$CLEAN_URL" ] && CLEAN_URL="$RAW_INPUT"

          if [[ "$CLEAN_URL" == *"sourceforge.net/projects/"* ]]; then
            CLEAN_URL=$(echo "$CLEAN_URL" | sed -E -e 's|/download/?$||' -e 's|sourceforge\.net/projects/|downloads.sourceforge.net/project/|' -e 's|/files/|/|')
          fi

          echo "Downloading: $CLEAN_URL"
          curl -LSs -f -o prebuilt/boot.img "$CLEAN_URL" || \
          curl -LSs -f -o prebuilt/boot.img "${CLEAN_URL}?use_mirror=autoselect" || \
          curl -LSs -f -o prebuilt/boot.img "${RAW_INPUT}"

          file prebuilt/boot.img | grep -qiE "HTML|ASCII text" && { echo "Error: Invalid boot image binary"; exit 1; }

          cp prebuilt/boot.img repack/
          cd repack
          magiskboot unpack boot.img

          KERNEL_BANNER=$(strings kernel | grep -m 1 -E "Linux version 5\.15\.[0-9]+" || true)
          echo "Stock Banner: ${KERNEL_BANNER}"

          STOCK_UTS=$(echo "$KERNEL_BANNER" | sed -E -n 's/.*Linux version ([^ ]+).*/\1/p' | head -n 1)
          DETECTED_SHA=$(echo "$STOCK_UTS" | grep -oE -- '-g[0-9a-f]+' | head -n 1 | sed 's/-g//' || true)
          SCM_SUFFIX=$(echo "$STOCK_UTS" | sed -E 's/^5\.15\.[0-9]+//' || true)

          echo "STOCK_UTS=${STOCK_UTS}" >> $GITHUB_ENV
          echo "DETECTED_SHA=${DETECTED_SHA}" >> $GITHUB_ENV
          echo "SCM_SUFFIX=${SCM_SUFFIX}" >> $GITHUB_ENV
          echo "CR_BRANCH=${{ matrix.cr_branch }}" >> $GITHUB_ENV
          echo "CR_VER=${{ matrix.cr_ver }}" >> $GITHUB_ENV
          echo "ANDROID_VER=${{ matrix.android_ver }}" >> $GITHUB_ENV

          echo "Target Version: crDroid ${{ matrix.cr_ver }} (${{ matrix.android_ver }}) -> Branch ${{ matrix.cr_branch }}"

          # 提取嵌入的 IKCONFIG
          python3 -c "
          data = open('kernel', 'rb').read()
          magic = bytes([0x49, 0x4B, 0x43, 0x46, 0x47, 0x5F, 0x53, 0x54, 0x1F, 0x8B])
          pos = data.find(magic)
          if pos != -1:
              with open('raw_config.gz', 'wb') as f:
                  f.write(data[pos+8:])
          " || true

          if [ -f "raw_config.gz" ]; then
            zcat raw_config.gz > "${GITHUB_WORKSPACE}/configs/stock.config" 2>/dev/null || \
            gzip -dc raw_config.gz > "${GITHUB_WORKSPACE}/configs/stock.config" 2>/dev/null || true
          fi

          [ -s "${GITHUB_WORKSPACE}/configs/stock.config" ] || { echo "Error: Failed to extract kernel config"; exit 1; }
          echo "Successfully extracted $(wc -l < ${GITHUB_WORKSPACE}/configs/stock.config) lines of stock config."

      - name: Checkout Kernel Source & Hardware Modules
        run: |
          TARGET_COMMIT="${{ matrix.custom_commit }}"
          [ -z "$TARGET_COMMIT" ] && TARGET_COMMIT="$DETECTED_SHA"

          # 解析短 SHA 为完整 40 位 SHA (保证 git fetch --depth 1 成功)
          if [ -n "$TARGET_COMMIT" ] && [ ${#TARGET_COMMIT} -lt 40 ]; then
            FULL_SHA=$(curl -s -f "https://api.github.com/repos/crdroidandroid/android_kernel_oneplus_sm8550/commits/${TARGET_COMMIT}" | grep -m1 '"sha":' | cut -d '"' -f 4 || true)
            [ -n "$FULL_SHA" ] && [ ${#FULL_SHA} -eq 40 ] && TARGET_COMMIT="$FULL_SHA"
          fi

          mkdir -p kernel && cd kernel
          git init
          git config advice.detachedHead false
          git remote add origin https://github.com/crdroidandroid/android_kernel_oneplus_sm8550.git

          if [ -n "$TARGET_COMMIT" ]; then
            echo "Fetching target commit: $TARGET_COMMIT"
            git fetch --depth 1 origin "$TARGET_COMMIT" || git fetch --depth 1 origin "${CR_BRANCH}"
            git checkout FETCH_HEAD
          else
            echo "Fetching ${CR_BRANCH} HEAD..."
            git fetch --depth 1 origin "${CR_BRANCH}"
            git checkout FETCH_HEAD
          fi

          FINAL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(echo "${FINAL_SHA}" | cut -c1-12)
          SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          BUILD_DATE=$(date +'%Y%m%d')

          # 链接 18 个配套硬件驱动目录
          git clone --depth 1 -b "${CR_BRANCH}" https://github.com/crdroidandroid/android_kernel_oneplus_sm8550-modules.git "${GITHUB_WORKSPACE}/sm8550-modules"
          MROOT="${GITHUB_WORKSPACE}/sm8550-modules"
          mkdir -p drivers/soc/oplus kernel/oplus_cpu
          ln -sfn "$MROOT/oplus/kernel/cpu/thermal"                                   kernel/oplus_cpu/thermal
          ln -sfn "$MROOT/oplus/kernel/touchpanel/kernelFwUpdate"                    drivers/base/kernelFwUpdate
          ln -sfn "$MROOT/oplus/kernel/touchpanel/oplus_touchscreen_v2"              drivers/input/touchscreen/oplus_touchscreen_v2
          ln -sfn "$MROOT/oplus/kernel/touchpanel/synaptics_hbp"                     drivers/input/touchscreen/synaptics_hbp
          ln -sfn "$MROOT/oplus/kernel/touchpanel/oplus_touchscreen_v2/touch_custom" drivers/input/touchscreen/touch_custom
          ln -sfn "$MROOT/oplus/secure/biometrics/fingerprints/bsp/uff/driver"       drivers/input/uff_fp_drivers
          ln -sfn "$MROOT/oplus/kernel/leds/aw210xx"                                 drivers/leds/aw210xx
          ln -sfn "$MROOT/oplus/kernel/vibrator/aw8697_haptic"                       drivers/misc/aw8697_haptic
          ln -sfn "$MROOT/oplus/kernel/device_info/tri_state_key"                    drivers/misc/tri_state_key
          ln -sfn "$MROOT/oplus/secure/common/bsp/drivers"                           drivers/misc/oplus_secure
          ln -sfn "$MROOT/oplus/kernel/nfc"                                          drivers/nfc/oplus_nfc
          ln -sfn "$MROOT/oplus/kernel/charger"                                      drivers/power/oplus
          ln -sfn "$MROOT/oplus/kernel/boot"                                         drivers/soc/oplus/boot
          ln -sfn "$MROOT/oplus/kernel/device_info/device_info"                      drivers/soc/oplus/device_info
          ln -sfn "$MROOT/oplus/kernel/dfr"                                          drivers/soc/oplus/dfr
          ln -sfn "$MROOT/oplus/kernel/dft"                                          drivers/soc/oplus/dft
          ln -sfn "$MROOT/oplus/sensor/kernel/oplus_consumer_ir"                     drivers/soc/oplus/oplus_consumer_ir
          ln -sfn "$MROOT/oplus/sensor/kernel/qcom/sensor"                           drivers/soc/oplus/sensor

          # 设置 vermagic 与导出命名变量
          [ -n "$SCM_SUFFIX" ] && echo -n "${SCM_SUFFIX}" > .scmversion || touch .scmversion

          VARIANT="${{ matrix.ksu_variant }}"
          case "${VARIANT}" in
            "KernelSU")
              KSU_TAG="ksu"
              KSU_LABEL="KernelSU (Official)"
              ;;
            "KernelSU-Next")
              KSU_TAG="ksu-next"
              KSU_LABEL="KernelSU-Next"
              ;;
            *)
              KSU_TAG="stock"
              KSU_LABEL="Pure Stock"
              ;;
          esac

          IMG_NAME="crdroid-${CR_BRANCH}-astonc-5.15.${SUBLEVEL}-${SHORT_SHA}-${KSU_TAG}-${BUILD_DATE}.img"
          AK3_NAME="crdroid-${CR_BRANCH}-astonc-5.15.${SUBLEVEL}-${SHORT_SHA}-${KSU_TAG}-${BUILD_DATE}-AK3.zip"

          echo "FINAL_SHA=${FINAL_SHA}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "SUBLEVEL=${SUBLEVEL}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "KSU_TAG=${KSU_TAG}" >> $GITHUB_ENV
          echo "KSU_LABEL=${KSU_LABEL}" >> $GITHUB_ENV
          echo "IMG_NAME=${IMG_NAME}" >> $GITHUB_ENV
          echo "AK3_NAME=${AK3_NAME}" >> $GITHUB_ENV

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          VARIANT="${{ matrix.ksu_variant }}"
          if [ "${VARIANT}" = "KernelSU" ]; then
            curl -LSs -f "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "${VARIANT}" = "KernelSU-Next" ]; then
            curl -LSs -f "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi

          mkdir -p out
          cp "${GITHUB_WORKSPACE}/configs/stock.config" out/.config
          [ -n "$SCM_SUFFIX" ] && echo -n "${SCM_SUFFIX}" > out/.scmversion || touch out/.scmversion

          if [ "${VARIANT}" != "None (Pure Stock)" ]; then
            ./scripts/config --file out/.config -e KSU -d KSU_SUSFS
          fi

          # 宿主机工具使用原生 gcc 编译以支持 libelf 与 BTF 生成
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld \
            HOSTCFLAGS="-I/usr/include" HOSTLDFLAGS="-L/usr/lib/x86_64-linux-gnu" \
            olddefconfig

          echo "Compiling kernel Image (Full LTO)..."
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld \
            HOSTCFLAGS="-I/usr/include" HOSTLDFLAGS="-L/usr/lib/x86_64-linux-gnu" \
            Image

      - name: Package Boot Image & AnyKernel3
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          IMAGE_PATH="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image"
          [ -f "$IMAGE_PATH" ] || { echo "Error: Kernel Image not found"; exit 1; }

          # 1. 打包 boot.img
          cd "${GITHUB_WORKSPACE}/repack"
          cp "$IMAGE_PATH" kernel
          magiskboot repack boot.img "${IMG_NAME}"
          mv "${IMG_NAME}" "${GITHUB_WORKSPACE}/dist/"

          # 2. 打包 AnyKernel3 卡刷包 (使用一加 Ace 3 / 12R 专属模板)
          cd "${GITHUB_WORKSPACE}"
          git clone --depth 1 https://github.com/OnePlusACE3-development/AnyKernel3-aston AnyKernel3
          rm -rf AnyKernel3/.git
          cp "$IMAGE_PATH" AnyKernel3/Image
          ( cd AnyKernel3 && zip -r9 "${GITHUB_WORKSPACE}/dist/${AK3_NAME}" . -x '.git*' 'README.md' )

          # 3. 保存元数据供发布步骤解析
          echo "CR_BRANCH=${CR_BRANCH}" > "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"
          echo "CR_VER=${CR_VER}" >> "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"
          echo "ANDROID_VER=${ANDROID_VER}" >> "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"
          echo "SUBLEVEL=${SUBLEVEL}" >> "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"
          echo "FINAL_SHA=${FINAL_SHA}" >> "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"
          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_WORKSPACE}/dist/metadata_${CR_BRANCH}_${KSU_TAG}.env"

      - name: Upload Matrix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.cr_branch }}-${{ env.KSU_TAG }}
          path: dist/*

  release:
    name: Publish Release
    needs: [setup, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release_dist
          merge-multiple: true

      - name: Publish Unified GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_VERSIONS: ${{ needs.setup.outputs.built_versions }}
          KSU_CHOICE: ${{ github.event.inputs.ksu_variant }}
        run: |
          cd release_dist

          BUILD_DATE=$(date +'%Y%m%d')

          # 清理元数据临时文件
          rm -f metadata*.env

          # 生成合并后的校验哈希
          sha256sum *.img *.zip > sha256.txt
          echo "Output files ready for release:"
          ls -la

          # 根据构建的版本生成统一的 Tag 和标题
          if [[ "$BUILT_VERSIONS" == *"12"* ]] && [[ "$BUILT_VERSIONS" == *"13"* ]]; then
            TAG_NAME="v12-v13-${KSU_CHOICE}-${BUILD_DATE}"
            RELEASE_TITLE="crDroid 12.0 & 13.0 (Android 16 & 17) - ${KSU_CHOICE}"
          elif [[ "$BUILT_VERSIONS" == *"13"* ]]; then
            TAG_NAME="v17.0-${KSU_CHOICE}-${BUILD_DATE}"
            RELEASE_TITLE="crDroid 13.0 (Android 17) - ${KSU_CHOICE}"
          else
            TAG_NAME="v16.0-${KSU_CHOICE}-${BUILD_DATE}"
            RELEASE_TITLE="crDroid 12.0 (Android 16) - ${KSU_CHOICE}"
          fi

          {
            echo "### 规格信息"
            echo "- **适用设备**: 一加 Ace 3 / 一加 12R (\`astonc\` / \`aston\`)"
            if [[ "$BUILT_VERSIONS" == *"12"* ]] && [[ "$BUILT_VERSIONS" == *"13"* ]]; then
              echo "- **包含系统**: crDroid 12.0 (Android 16) & crDroid 13.0 (Android 17)"
            elif [[ "$BUILT_VERSIONS" == *"13"* ]]; then
              echo "- **包含系统**: crDroid 13.0 (Android 17)"
            else
              echo "- **包含系统**: crDroid 12.0 (Android 16)"
            fi
            echo "- **构建方案**: ${KSU_CHOICE}"
            echo "- **编译器**: AOSP Clang r563880c (Clang 21.0.0)"
            echo "- **构建日期**: ${BUILD_DATE}"
            echo ""
            echo "### 产物格式说明"
            echo "- **\`.img\` (Boot 镜像)**: 官方底包重封装镜像，适用于电脑端 Fastboot 线刷（请根据文件名区分 16.0 与 17.0）。"
            echo "- **\`-AK3.zip\` (AnyKernel3 卡刷包)**: 原地替换内核并保留系统 ramdisk 与引导参数，推荐在 Recovery 模式下卡刷。"
            echo ""
            echo "### 版本标识说明"
            echo "- **\`crdroid-17.0-...\`**: 适配 **crDroid 13 (Android 17)** 底包"
            echo "- **\`crdroid-16.0-...\`**: 适配 **crDroid 12 (Android 16)** 底包"
            echo "- **\`ksu-next\`**: 集成 KernelSU-Next 分支"
            echo "- **\`ksu\`**: 集成 KernelSU 官方稳定分支"
            echo "- **\`stock\`**: 原生未 Root 纯净内核"
            echo ""
            echo "### 刷入说明"
            echo "- **Recovery 卡刷 (推荐)**: 手机进入 Recovery 模式 -> \`adb sideload <对应的 AK3.zip>\`"
            echo "- **Fastboot 线刷**: \`fastboot flash boot <对应的 boot.img>\`"
          } > release_notes.md

          gh release create "${TAG_NAME}" \
            crdroid-* sha256.txt \
            --repo "${{ github.repository }}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md || \
          gh release upload "${TAG_NAME}" crdroid-* sha256.txt --repo "${{ github.repository }}" --clobber
